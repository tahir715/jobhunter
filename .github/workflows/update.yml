name: Update and publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobhunter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: playwright install --with-deps chromium
      - run: python watcher.py
        continue-on-error: true
      - run: python enrich.py
        continue-on-error: true
      - run: python export.py
      - name: Save updated database
        run: |
          git config user.name "jobhunter-bot"
          git config user.email "jobhunter-bot@users.noreply.github.com"
          git add data/jobs.db
          git diff --cached --quiet || (git commit -m "Update jobs database" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4